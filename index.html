<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinéTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#111116] text-white">

  <header class="bg-[#1c1c24] p-4">
    <div class="mx-auto flex max-w-6xl justify-between">
      <h1 class="text-xl font-bold">
        Ciné<span class="text-red-500">Track</span>
      </h1>
      <p class="text-sm text-gray-400">Films et séries</p>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-5 p-4 lg:grid-cols-4">

    <section class="lg:col-span-3">

      <h2 class="mb-4 text-xl font-bold">Catalogue</h2>

      <div class="mb-4 flex flex-wrap gap-2">
        <input type="text" id="search" placeholder="Rechercher un film..."
          class="min-w-0 flex-1 rounded bg-[#25252e] p-2 text-sm outline-none">

        <select id="filter" class="rounded bg-[#25252e] p-2 text-sm">
          <option value="all">Tous</option>
          <option value="movie">Films</option>
          <option value="series">Séries</option>
        </select>
      </div>

      <p id="message" class="mb-3 text-sm text-gray-400"></p>

      <div id="movies" class="grid grid-cols-2 gap-3 sm:grid-cols-3 xl:grid-cols-4"></div>

      <div id="pagination" class="mt-5 flex justify-center gap-2"></div>

    </section>

    <aside class="h-fit rounded-lg bg-[#1c1c24] p-3">

      <h2 class="mb-3 font-bold">Mes favoris</h2>

      <p id="favoriteCount" class="mb-3 text-xs text-gray-400"></p>

      <div id="favorites" class="space-y-3"></div>

    </aside>

  </main>

  <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/80 p-4">

    <div class="relative max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-lg bg-[#1c1c24] p-4">

      <button id="closeModal" class="absolute right-3 top-2 text-xl">×</button>

      <div id="modalContent"></div>

    </div>

  </div>

  <script type="module" src="Files js/main.js"></script>

</body>

</html>
